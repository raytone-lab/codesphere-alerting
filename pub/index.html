    <style>
      .preloader {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        flex-direction: column;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .preloader__enter {
        opacity: 0;
        animation-name: preloader-fade-in;
        animation-iteration-count: 1;
        animation-duration: 0.9s;
        animation-delay: 0.5s;
        animation-fill-mode: forwards;
      }

      .preloader__bounce {
        text-align: center;
        animation-name: preloader-bounce;
        animation-duration: 0.9s;
        animation-iteration-count: infinite;
      }

      .preloader__logo {
        display: inline-block;
        animation-name: preloader-squash;
        animation-duration: 0.9s;
        animation-iteration-count: infinite;
        width: 60px;
        height: 60px;
        background-repeat: no-repeat;
        background-size: contain;
        background-image: url('/image/logo-ruidong.svg');
        width: 168px;
        height: 40px;
      }

      @keyframes preloader-fade-in {
        0% {
          opacity: 0;
          /*animation-timing-function: linear;*/
          animation-timing-function: cubic-bezier(0, 0, 0.5, 1);
        }

        100% {
          opacity: 1;
        }
      }

      @keyframes preloader-bounce {
        from,
        to {
          transform: translateY(0px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.1, 1);
        }

        50% {
          transform: translateY(-50px);
          animation-timing-function: cubic-bezier(0.9, 0, 0.7, 1);
        }
      }

      @keyframes preloader-squash {
        0% {
          transform: scaleX(1.3) scaleY(0.8);
          animation-timing-function: cubic-bezier(0.3, 0, 0.1, 1);
        }

        15% {
          transform: scaleX(0.75) scaleY(1.25);
          animation-timing-function: cubic-bezier(0, 0, 0.7, 0.75);
        }

        55% {
          transform: scaleX(1.05) scaleY(0.95);
          animation-timing-function: cubic-bezier(0.9, 0, 1, 1);
        }

        95% {
          transform: scaleX(0.75) scaleY(1.25);
          animation-timing-function: cubic-bezier(0, 0, 0, 1);
        }

        100% {
          transform: scaleX(1.3) scaleY(0.8);
          animation-timing-function: cubic-bezier(0, 0, 0.7, 1);
        }
      }

      #rd-sync-users-wrap {
        display: inline-flex;

      #rd-sync-users-btn.ant-btn {

      (function () {
        var TITLE = "睿动";
        var ICON = "/image/favicon.svg";
        function applyBrandTab() {
          if (document.title !== TITLE) document.title = TITLE;
          var icons = document.querySelectorAll("link[rel*='icon']");
          if (!icons.length) {
            var link = document.createElement("link");
            link.rel = "icon";
            link.href = ICON;
            document.head.appendChild(link);
            return;
          }
          icons.forEach(function (el) {
            if (el.getAttribute("href") !== ICON) el.setAttribute("href", ICON);
          });
        }
        applyBrandTab();
        document.addEventListener("DOMContentLoaded", applyBrandTab);
        setInterval(applyBrandTab, 800);
      })();

          var matched = findMatch(href);
          for (var p in iframePages) {
            var cfg = iframePages[p];
            var el = document.getElementById(cfg.id);
            if (p === matched) {
              if (!el) {
                document.documentElement.style.setProperty("--rd-sider-width", siderWidth() + "px");
                el = document.createElement("div");
                el.id = cfg.id;
                el.className = cfg.id;
                el.innerHTML = '<iframe src="' + cfg.src + '" title="' + cfg.title + '"></iframe>';
                document.body.appendChild(el);
              }
            } else if (el) {
              el.remove();
            }
          }
        }
        function hijack(href) {
          if (!findMatch(href)) return false;
          setTimeout(mount, 0);
          setTimeout(mount, 300);
          return false;
        }
        if (hijack(location.pathname + location.search)) return;
        var ps = history.pushState;
        history.pushState = function (s, t, u) {
          var ret = ps.apply(this, arguments);
          setTimeout(mount, 0);
          return ret;
        };
        var rs = history.replaceState;
        history.replaceState = function (s, t, u) {
          var ret = rs.apply(this, arguments);
          setTimeout(mount, 0);
          return ret;
        };
        window.addEventListener("popstate", function () { mount(); });
        document.addEventListener("click", function (e) {
          var a = e.target && e.target.closest ? e.target.closest("a") : null;
          if (!a) return;
          var href = a.getAttribute("href") || a.href || "";
          if (!findMatch(href)) return;
          setTimeout(mount, 0);
          setTimeout(mount, 300);
        }, true);
        setInterval(function () {
          for (var p in iframePages) {
            var el = document.getElementById(iframePages[p].id);
            if (el) {
              document.documentElement.style.setProperty("--rd-sider-width", siderWidth() + "px");

            }

      (function hideLeftoverChrome() {
        function hide() {
          function off(el) {
            el.style.setProperty("display", "none", "important");
          }
          document.querySelectorAll(".n9e-onboarding-badge").forEach(off);
          document.querySelectorAll('a[href="/landing"]').forEach(off);
          document.querySelectorAll("#HW_badge_cont, #HW_frame_cont, #HW_frame, .HW_badge_cont, .HW_frame_cont, .product-changelog, iframe[src*='headway']").forEach(off);

          });
          document.querySelectorAll("button.ant-btn").forEach(function (el) {
            if ((el.innerText || "").replace(/\s+/g, " ").trim() === "Nightingale AI") off(el);
          });
          document.querySelectorAll("div.h-8").forEach(function (el) {
            var t = (el.innerText || "").replace(/\s+/g, " ").trim();

            var list = nodes.length ? nodes : [el];
            list.forEach(function (node) {

              var t = (node.textContent || "").trim();
              if (t === "Balance Alert" || t === "Prepaid Balance Alert") node.textContent = "预付费余额预警";
            });
          });
          document.querySelectorAll('a[href="/system/enterprise-balance"], a[href*="/system/enterprise-balance"]').forEach(function (el) {

                t === "Enterprise Balance Config" ||
                t === "企业余额预警配置" ||
                t === "企业余额告警配置" ||
                t === "我的余额预警" ||
                t === "余额预警配置"

                node.textContent = "我的余额告警";

        setTimeout(hide, 0);

      (function syncBillingUsersBtn() {

        function isUsersPage() {
          var p = (location.pathname || "").replace(/\/+$/, "") || "/";

        }
        function token() {
          return localStorage.getItem("access_token") || localStorage.getItem("accessToken") || "";
        }
        function removeBtn() {
          var wrap = document.getElementById("rd-sync-users-wrap");
          if (wrap) wrap.remove();
          var btn = document.getElementById("rd-sync-users-btn");
          if (btn) btn.remove();
        }
        function addAnchor() {
          var operate = document.querySelector(".user-manage-content .user-manage-operate");
          if (operate) return operate.closest(".ant-space-item") || operate;
          var right = document.querySelector(".user-manage-content .event-table-search-right");
          if (right) return right.firstElementChild;
          var buttons = document.querySelectorAll(".user-manage-content button, .event-table-search-right button");
          for (var i = 0; i < buttons.length; i++) {
            var t = (buttons[i].innerText || "").replace(/\s+/g, " ").trim();
            if (t === "Add" || t === "新增" || t === "添加" || t === "创建用户" || t === "Create user") {
              return buttons[i].closest(".ant-space-item") || buttons[i];
            }
          }
          return null;
        }
        function bindClick(btn) {
          btn.onclick = function () {
            if (btn.disabled) return;
            btn.disabled = true;
            var prev = btn.textContent;
            btn.textContent = "同步中…";
            fetch("/api/n9e/users/sync-billing", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token(),
                "X-User-Token": token()
              }
            }).then(function (r) { return r.text().then(function (text) { return { r: r, text: text }; }); })
              .then(function (x) {
                var j = {};
                if (x.text) {
                  try { j = JSON.parse(x.text); } catch (e) { throw new Error(x.text); }
                }
                if (!x.r.ok || j.err) throw new Error(j.err || x.text || ("请求失败 " + x.r.status));
                var d = j.dat || {};
                var msg = "同步完成：新增 " + (d.created || 0) + "，更新 " + (d.updated || 0);
                if (d.skipped_admin) msg += "，跳过管理员 " + d.skipped_admin;
                if (d.initial_password && d.created) msg += "。新账号初始密码：" + d.initial_password;

                location.reload();
              })
              .catch(function (e) {
                alert(e.message || String(e));
                btn.disabled = false;
                btn.textContent = prev;
              });
          };
        }
        function ensure() {

            removeBtn();

          }
          var anchor = addAnchor();
          if (!anchor || !anchor.parentElement) return;
          var existing = document.getElementById("rd-sync-users-wrap");
          if (existing) {

          wrap.appendChild(btn);

        function patchHistory() {

        }, true);
        watchDom();
        setInterval(function () {
          patchHistory();
          watchDom();
          ensure();
        }, 400);
        ensure();
